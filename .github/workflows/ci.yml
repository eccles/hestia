name: ci
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  vulncheck:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup ASDF VM
        uses: asdf-vm/actions/install@v4
        with:
          asdf_version: 0.17.0
      - name: tools 
        run: just tools
        shell: bash
      - name: generate 
        run: just generate
        shell: bash
      - name: qa
        run: just qa
        shell: bash
      - name: unittests
        run: just unittest
        shell: bash
      - name: build
        run: just build
        shell: bash
